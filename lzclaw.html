<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(180deg, #eef8f8 0%, #dff2f1 100%);
            color: #102a2c;
        }

        .contact-card {
            width: min(100%, 420px);
            padding: 32px 28px;
            border-radius: 24px;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 16px 40px rgba(16, 42, 44, 0.12);
        }

        .contact-card h1 {
            margin: 0 0 10px;
            font-size: 30px;
            line-height: 1.2;
        }

        .contact-card p {
            margin: 0;
            font-size: 15px;
            line-height: 1.7;
            color: #456466;
        }

        .qrcode {
            width: min(100%, 280px);
            display: block;
            margin: 28px auto 18px;
            border-radius: 18px;
            background: #ffffff;
        }

        .tip {
            font-size: 14px;
            color: #5c7a7b;
        }
    </style>
</head>
<body>
    <main class="contact-card">
        <h1>联系我们</h1>
        <p>扫码添加联系二维码，获取产品咨询与使用支持。</p>
        <img class="qrcode" src="/qrcode.jpg" alt="联系我们二维码">
        <p class="tip">请使用微信或手机相机扫码</p>
    </main>
</body>
</html>
